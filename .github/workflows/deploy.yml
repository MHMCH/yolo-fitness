name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_BASE_PATH_OVERRIDE: ${{ vars.VITE_BASE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate public configuration
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const { VITE_SUPABASE_URL: projectUrl, VITE_SUPABASE_PUBLISHABLE_KEY: key } = process.env
          if (!projectUrl || !key) throw new Error('Set the public Supabase URL and publishable key repository variables.')
          const url = new URL(projectUrl)
          if (url.protocol !== 'https:' || url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('The public Supabase URL must be an HTTPS project origin.')
          }
          let role
          try { role = JSON.parse(Buffer.from(key.split('.')[1] ?? '', 'base64url').toString()).role } catch {}
          if (!key.startsWith('sb_publishable_') && role !== 'anon') {
            throw new Error('Only a publishable key (or legacy anon key) is allowed in the frontend.')
          }
          NODE
      - name: Set Pages base path
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY%/*}"
          base="/$repository/"
          if [[ "${repository,,}" == "${owner,,}.github.io" ]]; then base="/"; fi
          if [[ -n "$VITE_BASE_PATH_OVERRIDE" ]]; then base="$VITE_BASE_PATH_OVERRIDE"; fi
          if [[ ! "$base" =~ ^/([A-Za-z0-9._-]+/)*$ ]]; then
            echo 'VITE_BASE_PATH must be / or a slash-delimited path with a trailing slash.' >&2
            exit 1
          fi
          echo "VITE_BASE_PATH=$base" >> "$GITHUB_ENV"
      - uses: actions/configure-pages@v5
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4